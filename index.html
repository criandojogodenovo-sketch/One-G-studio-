<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ONE G STUDIO — Free native Android apps for creators</title>
    <meta
      name="description"
      content="ONE G STUDIO is an independent studio building free, offline-first, native Android apps: 3D modeling, a mobile game engine, video editing and pixel art."
    />
    <meta name="theme-color" content="#0B0D10" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Open Graph / Twitter — tags estáticas do primeiro carregamento.
         As rotas atualizam título/descrição em runtime (ver src/lib/seo.ts).
         og:image e og:url absolutas são emitidas quando site.siteUrl for
         preenchido (ver src/data/site.ts e README → SEO). -->
    <meta property="og:site_name" content="ONE G STUDIO" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="ONE G STUDIO — Free native Android apps for creators" />
    <meta
      property="og:description"
      content="Games, tools and video — four free, offline-first, native Android apps, developed in the open."
    />
    <meta property="og:image" content="/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ONE G STUDIO — Free native Android apps for creators" />
    <meta
      name="twitter:description"
      content="Games, tools and video — four free, offline-first, native Android apps, developed in the open."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
